<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Redacción | Altiplano Vibrante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #0284c7;
      --accent-gold: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --font: 'Montserrat', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .panel-container {
      max-width: 850px;
      margin: auto;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 2.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 { font-family: var(--font); font-size: 1.5rem; color: var(--text); }
    h1 span { color: var(--accent-gold); }

    .btn-view-site {
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }

    .token-box {
      background: rgba(2, 132, 199, 0.1);
      border: 1px solid rgba(2, 132, 199, 0.3);
      padding: 1.2rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .token-box label {
      display: block;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.4rem;
      font-family: var(--font);
    }

    .token-input-group { display: flex; gap: 0.5rem; }

    .form-group { margin-bottom: 1.5rem; }

    label {
      display: block;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-gold), #b45309);
      color: #fff;
      border: none;
      padding: 1rem;
      font-family: var(--font);
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn-submit:disabled { background: #64748b; cursor: not-allowed; transform: none; }

    #statusAlert {
      display: none;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1.5rem;
      font-weight: 600;
      text-align: center;
    }
    .alert-success { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
    .alert-error { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }
  </style>
</head>
<body>

  <div class="panel-container">
    <header>
      <h1>Altiplano <span>Vibrante</span> • Panel Editorial</h1>
      <a href="https://altiplanovibrantejaimewramosh.vercel.app" target="_blank" class="btn-view-site">🌐 Ver Revista en Vivo</a>
    </header>

    <!-- Token GitHub -->
    <div class="token-box">
      <label for="githubToken">🔑 Clave de Acceso de GitHub (Solo se ingresa una vez):</label>
      <div class="token-input-group">
        <input type="password" id="githubToken" placeholder="Pegue aquí su clave (ghp_...)" />
        <button type="button" id="btnSaveToken" style="width: auto; padding: 0 1.2rem; background: var(--primary); color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Guardar</button>
      </div>
      <small style="color: var(--text-muted); display:block; margin-top:0.4rem;">
        ¿No tiene su clave? <a href="https://github.com/settings/tokens/new?scopes=repo&description=PanelAltiplano" target="_blank" style="color: #38bdf8;">Créela aquí en 30 segundos</a> (marque la casilla 'repo').
      </small>
    </div>

    <!-- Formulario de Redacción -->
    <form id="articleForm">
      <div class="form-group">
        <label for="title">Título del Artículo o Ensayo</label>
        <input type="text" id="title" placeholder="Ej: Inversión pública y desarrollo en Puno..." required />
      </div>

      <div class="form-group">
        <label for="category">Sección</label>
        <select id="category" required>
          <option value="Opinión">Tribuna de Opinión y Realidad</option>
          <option value="Educación">Educación y Formación</option>
          <option value="Cultura">Cultura, Costumbres y Tradición</option>
          <option value="Actualidad">Actualidad y Desarrollo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="image">Foto de Portada (Enlace URL opcional)</label>
        <input type="url" id="image" placeholder="https://images.unsplash.com/... (Opcional)" />
      </div>

      <div class="form-group">
        <label for="summary">Resumen Breve (Para la portada)</label>
        <textarea id="summary" rows="3" placeholder="Escriba un resumen de 2 o 3 líneas..." required></textarea>
      </div>

      <div class="form-group">
        <label for="body">Contenido Completo del Artículo</label>
        <textarea id="body" rows="8" placeholder="Redacte aquí todo el texto del artículo..."></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">🚀 Publicar Artículo en Altiplano Vibrante</button>
    </form>

    <div id="statusAlert"></div>
  </div>

  <script>
    const REPO = 'jaimewilly-rh/altiplanovibrantejaimewramosh';
    const FILE_PATH = 'content/articulos.json';

    // Cargar clave guardada en el navegador
    const savedToken = localStorage.getItem('altiplano_gh_token');
    if (savedToken) {
      document.getElementById('githubToken').value = savedToken;
    }

    // Guardar clave
    document.getElementById('btnSaveToken').addEventListener('click', () => {
      const val = document.getElementById('githubToken').value.trim();
      if (val) {
        localStorage.setItem('altiplano_gh_token', val);
        showAlert('✅ Clave guardada correctamente en este navegador.', 'success');
      }
    });

    // Publicar artículo
    document.getElementById('articleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const token = document.getElementById('githubToken').value.trim();
      if (!token) {
        showAlert('⚠️ Por favor ingrese su clave de GitHub arriba y presione Guardar.', 'error');
        return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = '⏳ Publicando en la web...';

      const nuevoArticulo = {
        title: document.getElementById('title').value.trim(),
        category: document.getElementById('category').value,
        date: new Date().toISOString(),
        image: document.getElementById('image').value.trim(),
        summary: document.getElementById('summary').value.trim(),
        body: document.getElementById('body').value.trim()
      };

      try {
        const getUrl = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
        const resGet = await fetch(getUrl, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!resGet.ok) throw new Error('No se pudo conectar a GitHub. Verifique su clave.');

        const dataGet = await resGet.json();
        const sha = dataGet.sha;
        
        const decodedContent = decodeURIComponent(escape(atob(dataGet.content.replace(/\n/g, ''))));
        const jsonActual = JSON.parse(decodedContent);

        if (!jsonActual.articulos) jsonActual.articulos = [];
        jsonActual.articulos.unshift(nuevoArticulo);

        const updatedJsonStr = JSON.stringify(jsonActual, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(updatedJsonStr)));

        const resPut = await fetch(getUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Publicar: ${nuevoArticulo.title}`,
            content: encodedContent,
            sha: sha
          })
        });

        if (!resPut.ok) throw new Error('Error al guardar en GitHub.');

        showAlert(`🎉 ¡Artículo "${nuevoArticulo.title}" publicado con éxito en la portada!`, 'success');
        document.getElementById('articleForm').reset();

      } catch (err) {
        showAlert(`❌ ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Publicar Artículo en Altiplano Vibrante';
      }
    });

    function showAlert(msg, type) {
      const el = document.getElementById('statusAlert');
      el.className = type === 'success' ? 'alert-success' : 'alert-error';
      el.innerHTML = msg;
      el.style.display = 'block';
    }
  </script>

</body>
</html>
